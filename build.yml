name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          set -e
          mkdir -p app/src/main/java/com/fatafeatchef/app
          mkdir -p gradle/wrapper
          echo "include ':app'" > settings.gradle
          echo "rootProject.name='FatafeatChef'" >> settings.gradle
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cat > build.gradle <<'EOF'
          task clean(type: Delete) { delete rootProject.buildDir }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.0' apply true }
          android {
           namespace 'com.fatafeatchef.app'
           compileSdk 34
           defaultConfig { applicationId "com.fatafeatchef.app"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
           compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <application android:label="Fatafeat Chef">
            <activity android:name=".MainActivity" android:exported="true">
             <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
            </activity>
           </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/fatafeatchef/app/MainActivity.java <<'EOF'
          package com.fatafeatchef.app;
          import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient; import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
           protected void onCreate(Bundle b){
            super.onCreate(b);
            WebView w=new WebView(this);
            w.getSettings().setJavaScriptEnabled(true);
            w.setWebViewClient(new WebViewClient());
            w.loadUrl("https://fatafeatchef.com/");
            setContentView(w);
           }
          }
          EOF
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | sdkmanager --licenses > /dev/null || true
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: fatafeatchef-apk
          path: app/build/outputs/apk/debug/app-debug.apk
